<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Order — OpenRide.bike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <style>
    :root {
      --forest: #2C4A2E;
      --moss:   #4A7C59;
      --parch:  #F4EFE4;
      --accent: #C17F3A;
      --ink:    #1e2a1f;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--parch); color: var(--ink); min-height: 100vh; }
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem; height: 60px;
      background: rgba(28, 42, 31, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(138,175,138,0.15);
    }
    .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.1em; color: var(--parch); text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 0.75rem; }
    .nav-links button { background: none; border: none; color: rgba(244,239,228,0.7); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; letter-spacing: 0.03em; }
    .nav-links a { color: rgba(244,239,228,0.7); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; letter-spacing: 0.03em; text-decoration: none; }
    .nav-links .sep { color: rgba(244,239,228,0.3); }
    .page-wrap { max-width: 480px; margin: 0 auto; padding: 120px 24px 80px; }
    .order-summary {
      background: #fff; border: 1px solid #ddd; border-radius: 3px;
      padding: 24px; margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .product-name { font-weight: 600; font-size: 1rem; color: var(--ink); }
    .product-desc { font-size: 0.82rem; color: #666; margin-top: 4px; }
    .price { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--forest); letter-spacing: 0.04em; }
    .email-section { background: #fff; border: 1px solid #ddd; border-radius: 3px; padding: 24px; margin-bottom: 24px; }
    .email-section label { display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 8px; }
    .email-section input {
      width: 100%; padding: 12px 14px; border: 2px solid #ddd; border-radius: 3px;
      font-size: 0.95rem; font-family: 'DM Sans', sans-serif; transition: border-color 0.15s;
    }
    .email-section input:focus { outline: none; border-color: var(--moss); }
    .error-msg { background: #fee; border: 1px solid #fcc; border-radius: 3px; padding: 12px 16px; font-size: 0.87rem; color: #c00; margin-bottom: 16px; display: none; }
    .btn-checkout {
      width: 100%; padding: 18px; background: var(--accent); color: #fff;
      border: none; border-radius: 3px; font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 0.1em; cursor: pointer; transition: background 0.15s;
    }
    .btn-checkout:hover { background: #a86b2e; }
    .btn-checkout:disabled { background: #bbb; cursor: not-allowed; }
    .secure-note { text-align: center; font-size: 0.78rem; color: #999; margin-top: 10px; }
  </style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="/">Open<span>Ride</span>.bike</a>
  <div class="nav-links">
    <button onclick="window.location.href='/?signin=true'">Sign In</button>
    <span class="sep">|</span>
    <a href="/?signup=true">Create Account</a>
  </div>
</nav>
<div class="page-wrap">
  <div class="order-summary">
    <div>
      <div class="product-name">Natchez Trace South — Digital Guide</div>
      <div class="product-desc">PDF + GPX + Cue Sheet · Instant delivery</div>
    </div>
    <div class="price">$19</div>
  </div>
  <div class="error-msg" id="error-msg"></div>
  <div class="email-section" id="email-section" style="display:none;">
    <label for="guest-email">Where should we send your guide?</label>
    <input type="email" id="guest-email" placeholder="your@email.com">
  </div>
  <button class="btn-checkout" id="btn-submit">Continue to Payment →</button>
  <p class="secure-note">🔒 Secure checkout via Stripe · Instant PDF delivery</p>
</div>
<script>
  const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  let currentUser = null;

  supabase.auth.getSession().then(({ data: { session } }) => {
    currentUser = session?.user ?? null;
    if (!currentUser) document.getElementById('email-section').style.display = 'block';
  });

  document.getElementById('btn-submit').addEventListener('click', async () => {
    const btn = document.getElementById('btn-submit');
    const errorEl = document.getElementById('error-msg');
    errorEl.style.display = 'none';

    const guestEmail = document.getElementById('guest-email')?.value.trim() || '';

    if (!currentUser && (!guestEmail || !guestEmail.includes('@'))) {
      errorEl.textContent = 'Please enter a valid email address so we can send your guide.';
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Connecting to Stripe...';

    try {
      const response = await fetch('/.netlify/functions/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionData: {
            supabase_user_id: currentUser?.id || '',
            customer_email: currentUser?.email || guestEmail,
          },
          formData: {
            pace: 'moderate',
            accommodation: 'mixed',
            season: 'spring',
            party_size: '1',
            partner_emails: '',
          }
        })
      });
      const data = await response.json();
      if (!response.ok || !data.url) throw new Error(data.error || 'Checkout failed — please try again.');
      window.location.href = data.url;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Continue to Payment →';
    }
  });
</script>
</body>
</html>

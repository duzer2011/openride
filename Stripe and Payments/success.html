<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRide | Success</title>
    <style>
        :root {
            --forest-green: #2C4A2E;
            --sage-green: #4A7C59;
            --parchment: #F4EFE4;
            --accent-rust: #C17F3A;
            --text-dark: #1F2937;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--parchment);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--forest-green);
            font-family: 'Playfair Display', serif;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        .message {
            color: #6B7280;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .button {
            display: inline-block;
            background-color: var(--sage-green);
            color: white;
            padding: 1rem 2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .button:hover {
            background-color: var(--forest-green);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon">🚲</div>
        <h1>You're All Set!</h1>
        <p class="message">Your personalized Natchez Trace route guide is on its way to your inbox. It should arrive in
            the next few minutes.</p>
        <p class="message" style="font-size: 0.9rem; margin-bottom: 2.5rem;">If you added any riding partners, we've
            sent them their prep emails too.</p>
        <a href="/" class="button">Back to Home</a>
    </div>

</body>

</html>

[build]
  publish = "public"
  command = "node generate-config.js"
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["content/**"]

# Paid content must never be served statically. Functions read these from disk.
[[redirects]]
  from = "/guides/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/guide/*/guide-data.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/plan"
  to = "/natchez-trace-lower.html"
  status = 301

[[redirects]]
  from = "/plan.html"
  to = "/natchez-trace-lower.html"
  status = 301
  force = true

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

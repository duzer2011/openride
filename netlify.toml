[build]
  command = "node generate-config.js"
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["guides/**"]

[[redirects]]
  from = "/plan"
  to = "/natchez-trace-lower.html"
  status = 301

[[redirects]]
  from = "/plan.html"
  to = "/natchez-trace-lower.html"
  status = 301
  force = true

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

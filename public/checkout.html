<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
  <title>Complete Your Order — OpenRide.bike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest: #2C4A2E;
      --moss:   #4A7C59;
      --parch:  #F4EFE4;
      --accent: #C17F3A;
      --ink:    #1e2a1f;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--parch); color: var(--ink); min-height: 100vh; }
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem; height: 60px;
      background: rgba(28, 42, 31, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(138,175,138,0.15);
    }
    .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.1em; color: var(--parch); text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; align-items: center; gap: 0.75rem; }
    .nav-links button { background: none; border: none; color: rgba(244,239,228,0.7); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; letter-spacing: 0.03em; }
    .nav-links a { color: rgba(244,239,228,0.7); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; letter-spacing: 0.03em; text-decoration: none; }
    .nav-links .sep { color: rgba(244,239,228,0.3); }
    .page-wrap { max-width: 480px; margin: 0 auto; padding: 120px 24px 80px; }
    .order-summary {
      background: #fff; border: 1px solid #ddd; border-radius: 3px;
      padding: 24px; margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .product-name { font-weight: 600; font-size: 1rem; color: var(--ink); }
    .product-desc { font-size: 0.82rem; color: #666; margin-top: 4px; }
    .price { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--forest); letter-spacing: 0.04em; }
    .email-section { background: #fff; border: 1px solid #ddd; border-radius: 3px; padding: 24px; margin-bottom: 24px; }
    .email-section label { display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 8px; }
    .email-section input {
      width: 100%; padding: 12px 14px; border: 2px solid #ddd; border-radius: 3px;
      font-size: 0.95rem; font-family: 'DM Sans', sans-serif; transition: border-color 0.15s;
    }
    .email-section input:focus { outline: none; border-color: var(--moss); }
    .error-msg { background: #fee; border: 1px solid #fcc; border-radius: 3px; padding: 12px 16px; font-size: 0.87rem; color: #c00; margin-bottom: 16px; display: none; }
    .btn-checkout {
      width: 100%; padding: 18px; background: var(--accent); color: #fff;
      border: none; border-radius: 3px; font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 0.1em; cursor: pointer; transition: background 0.15s;
    }
    .btn-checkout:hover { background: #a86b2e; }
    .btn-checkout:disabled { background: #bbb; cursor: not-allowed; }
    .secure-note { text-align: center; font-size: 0.78rem; color: #999; margin-top: 10px; }
  </style>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="/">Open<span>Ride</span>.bike</a>
  <div class="nav-links">
    <button onclick="window.location.href='/?signin=true'">Sign In</button>
    <span class="sep">|</span>
    <a href="/?signup=true">Create Account</a>
  </div>
</nav>
<div class="page-wrap">
  <div class="order-summary">
    <div>
      <div class="product-name">Natchez Trace Inn-to-Inn: Jackson to Natchez</div>
      <div class="product-desc">Every day, every inn, getting home. Updates included, no expiry.</div>
    </div>
    <div class="price">$19</div>
  </div>
  <div class="error-msg" id="error-msg"></div>
  <div class="email-section" id="signin-section" style="display:none">
    <label>Sign in first</label>
    <p style="font-size:0.9rem;color:#555;margin-bottom:14px">Your tour is tied to your account, so you can open it on any device.</p>
    <a class="btn-checkout" id="btn-signin" style="display:block;text-align:center;text-decoration:none" href="/?login=true">Sign in or create account</a>
  </div>
  <div class="email-section" id="signed-in-section" style="display:none">
    <label>Buying as</label>
    <p id="user-email" style="font-size:0.95rem"></p>
  </div>
  <button class="btn-checkout" id="btn-submit" style="display:none">Continue to Payment</button>
  <p class="secure-note">Secure checkout via Stripe</p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  // Old links use ?segment=lower. The server decides the price for the route, not this page.
  const ROUTE_SLUG = params.get('route') || 'natchez-lower';
  const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnon);
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('btn-submit');

  function showError(msg) { errorEl.textContent = msg; errorEl.style.display = 'block'; }

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const back = '/checkout?route=' + encodeURIComponent(ROUTE_SLUG);
      document.getElementById('btn-signin').href = '/?login=true&redirect=' + encodeURIComponent(back);
      document.getElementById('signin-section').style.display = 'block';
      return;
    }
    document.getElementById('user-email').textContent = session.user.email;
    document.getElementById('signed-in-section').style.display = 'block';
    btn.style.display = 'block';

    btn.addEventListener('click', async () => {
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Connecting to Stripe...';
      try {
        const { data: { session: fresh } } = await sb.auth.getSession();
        if (!fresh) { window.location.reload(); return; }
        const response = await fetch('/.netlify/functions/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + fresh.access_token },
          body: JSON.stringify({ route_slug: ROUTE_SLUG })
        });
        const data = await response.json();
        if (!response.ok || !data.url) throw new Error(data.error || 'Checkout failed. Please try again.');
        window.location.href = data.url;
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.textContent = 'Continue to Payment';
      }
    });
  })();
</script>
</body>
</html>
